services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_tutor
      POSTGRES_USER: ai_tutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_tutor -d ai_tutor"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  llm-gateway:
    build:
      context: .
      dockerfile: services/llm_gateway/Dockerfile
    environment:
      LLM_GATEWAY_PROVIDER: ${LLM_GATEWAY_PROVIDER:-fallback}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  tutor-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://ai_tutor:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/ai_tutor
      AI_PROVIDER: gateway
      LLM_GATEWAY_URL: http://llm-gateway:8001
      REDIS_URL: redis://redis:6379/0
      PHOTO_OCR_PROVIDER: ${PHOTO_OCR_PROVIDER:-auto}
      MATHPIX_APP_ID: ${MATHPIX_APP_ID:-}
      MATHPIX_APP_KEY: ${MATHPIX_APP_KEY:-}
      # Dev/e2e default: families are auto-approved. The pilot stack
      # (docker-compose.pilot.yml + .env.pilot) keeps the gate on.
      REQUIRE_FAMILY_APPROVAL: ${REQUIRE_FAMILY_APPROVAL:-false}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
      # Cloudflare edge: off in dev — the app isn't behind Cloudflare locally.
      # The pilot stack (.env.pilot) turns both on; docs/operations/CLOUDFLARE_SETUP.md.
      CLOUDFLARE_TRUSTED: ${CLOUDFLARE_TRUSTED:-false}
      GEO_ENFORCEMENT_ENABLED: ${GEO_ENFORCEMENT_ENABLED:-false}
      ALLOWED_COUNTRIES: ${ALLOWED_COUNTRIES:-US,CA}
      # Auth throttles stay on in dev (real code path) with generous limits so
      # repeated e2e sign-ups/sign-ins don't trip them. Pilot uses real limits.
      AUTH_THROTTLES_ENABLED: ${AUTH_THROTTLES_ENABLED:-true}
      LOGIN_RATE_LIMIT_PER_IP: ${LOGIN_RATE_LIMIT_PER_IP:-200}
      REGISTER_RATE_LIMIT_PER_IP: ${REGISTER_RATE_LIMIT_PER_IP:-50}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-50}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_TRIAL_DAYS: ${STRIPE_TRIAL_DAYS:-14}
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      tutor-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
