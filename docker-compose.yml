services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_tutor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_tutor"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ai_tutor_pgdata:/var/lib/postgresql/data

volumes:
  ai_tutor_pgdata:
