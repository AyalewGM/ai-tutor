name: Acquire OSPI 2026 standards evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve official publisher files (read-only)
        run: python scripts/acquire_ospi_2026_standards.py --output source-evidence/ospi-2026
      - name: Preserve evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ospi-2026-source-candidates
          path: source-evidence/ospi-2026/
          retention-days: 14
          if-no-files-found: warn
