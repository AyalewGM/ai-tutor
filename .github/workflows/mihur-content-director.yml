name: Mihur Content Director — read-only handoff

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Mihur Content Factory PR number"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  content-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EVENT_PR: ${{ github.event.pull_request.number }}
      MANUAL_PR: ${{ inputs.pr_number }}
    steps:
      - name: Checkout trusted default-branch code only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine target PR
        id: target
        shell: bash
        run: |
          python - <<'PY'
          import os
          value = os.environ.get("MANUAL_PR") or os.environ.get("EVENT_PR")
          if not value or not value.isascii() or not value.isdecimal():
              raise SystemExit("Missing numeric PR number; fail closed")
          number = int(value)
          if not 1 <= number <= 1_000_000:
              raise SystemExit("Invalid PR number")
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write(f"pr={number}\n")
          PY

      - name: Gather GitHub facts (no reviewer impersonation)
        run: |
          python -m scripts.math_content_github_evidence \
            --pr-number "${{ steps.target.outputs.pr }}" \
            --output "$RUNNER_TEMP/mihur-evidence.json"

      - name: Create offline EQ3 content quality report
        run: |
          python -m pip install --disable-pip-version-check 'sympy>=1.14,<1.15'
          python -m scripts.math_content_factory \
            --blueprint docs/content_factory/mth1w_eq3_factory.v1.json \
            --seeds 32 \
            --output "$RUNNER_TEMP/mihur-factory.json"

      - name: Reconcile single-owner handoff
        run: |
          python -m scripts.math_content_orchestrator \
            --factory-report "$RUNNER_TEMP/mihur-factory.json" \
            --evidence "$RUNNER_TEMP/mihur-evidence.json" \
            --output "$RUNNER_TEMP/mihur-handoff.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "mihur-handoff.json").read_text()
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Mihur Content Director — read-only handoff\n\n")
              summary.write(f"**Skill:** {report['skill']}\n\n")
              summary.write(f"**Exact SHA:** `{report['content_sha']}`\n\n")
              summary.write(f"**Next owner:** {report['next_owner']}\n\n")
              summary.write(f"**Action:** {report['next_action']}\n\n")
              summary.write("**Agent execution:** NOT_EXECUTED. **Release:** NOT_AUTHORIZED.\n")
          PY

      - name: Upload evidence for human review
        uses: actions/upload-artifact@v4
        with:
          name: mihur-content-handoff-${{ steps.target.outputs.pr }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mihur-evidence.json
            ${{ runner.temp }}/mihur-factory.json
            ${{ runner.temp }}/mihur-handoff.json
          retention-days: 14
