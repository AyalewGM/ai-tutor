name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_tutor
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_tutor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/ai_tutor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Migrate database
        run: alembic upgrade head

      - name: Seed Sprint 1 content
        run: python scripts/seed_sprint1.py

      - name: Test
        run: pytest -q

  containers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deployable images
        run: docker compose build tutor-api llm-gateway frontend

      - name: Start Compose stack
        run: docker compose up -d --wait

      - name: Verify Tutor API health
        run: curl --fail --retry 5 --retry-delay 2 http://localhost:8002/health

      - name: Verify Gateway health from Tutor network
        run: docker compose exec -T tutor-api python -c "import urllib.request; urllib.request.urlopen('http://llm-gateway:8001/health')"

      - name: Verify frontend health
        run: curl --fail --retry 5 --retry-delay 2 http://localhost:3000/healthz

      - name: Migrate browser E2E database
        run: docker compose exec -T tutor-api alembic upgrade head

      - name: Seed browser E2E content
        run: docker compose exec -T tutor-api python scripts/seed_sprint1.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser E2E dependencies
        working-directory: e2e
        run: npm install

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run synthetic browser E2E
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
