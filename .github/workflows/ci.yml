name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_tutor
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_tutor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/ai_tutor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Validate canonical alias inventory (read-only)
        run: python scripts/validate_canonical_alias_map.py

      - name: Migrate database
        run: alembic upgrade head

      - name: Seed Sprint 1 content
        run: python scripts/seed_sprint1.py

      - name: Verify Sprint 1 seed is idempotent on isolated PostgreSQL
        run: |
          python - <<'PY'
          import json

          from sqlalchemy import select

          from app.core.database import SessionLocal
          from app.models import Curriculum, Misconception, Problem, Skill, SkillPrerequisite
          from scripts.seed_sprint1 import seed

          # Metadata/content only: never read or mutate learner/attempt/mastery tables.
          def inventory():
              with SessionLocal() as db:
                  result = {}
                  for model, columns in (
                      (Curriculum, (Curriculum.id, Curriculum.code, Curriculum.version)),
                      (Skill, (Skill.id, Skill.curriculum_id, Skill.code)),
                      (Misconception, (Misconception.id, Misconception.skill_id, Misconception.code)),
                      (Problem, (Problem.id, Problem.primary_skill_id, Problem.prompt, Problem.canonical_answer, Problem.solution)),
                      (SkillPrerequisite, (SkillPrerequisite.skill_id, SkillPrerequisite.prerequisite_skill_id, SkillPrerequisite.importance_weight)),
                  ):
                      rows = db.execute(select(*columns)).all()
                      result[model.__tablename__] = sorted(
                          json.dumps(tuple(str(v) if not isinstance(v, dict)
                                           else v for v in row), sort_keys=True, default=str)
                          for row in rows
                      )
                  return result

          before = inventory()
          seed()
          after = inventory()
          assert after == before, "Sprint 1 seed changed existing content/identities on rerun"
          print("Synthetic Sprint 1 reseed idempotency: PASS")
          PY

      # Synthetic Sprint 1 only; not a full Grades 1–9 population claim.
      # Per-local-skill evidence is archived even if later unrelated tests fail.
      - name: Snapshot synthetic per-skill question depth
        run: |
          python -m scripts.audit_persisted_question_depth \
            --database-url "$DATABASE_URL" \
            --source-sha "$(git rev-parse HEAD)" \
            --samples 2 \
            --output "$RUNNER_TEMP/mihur-sprint1-skill-depth.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "mihur-sprint1-skill-depth.json").read_text())
          print("SYNTHETIC SPRINT 1 ONLY — per-grade population:", report["grades"])
          print("Thinnest populated local skills (up to 20):")
          for item in report["thin_populated_priority"][:20]:
              print(item["grade_or_course"], item["curriculum_code"],
                    item["skill_code"], item["stored_distinct_tasks"],
                    ",".join(item["issue_flags"]))
          PY

      - name: Upload synthetic per-skill audit artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mihur-sprint1-per-skill-depth
          path: ${{ runner.temp }}/mihur-sprint1-skill-depth.json
          if-no-files-found: error

      - name: Test
        env:
          # Isolated CI PostgreSQL is migrated and seeded in the prior steps.
          # Run opt-in taxonomy persistence regression against real DB rows.
          TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/ai_tutor
          MIHUR_GATE4_ISOLATED_DB: '1'
        run: pytest -q

      - name: Publisher PostgreSQL learner and persistence regression
        env:
          MIHUR_PUBLISHER_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: python -m pytest tests/test_content_publishing.py -q

      - name: Development owner rejection regressions (must execute, no skips)
        run: |
          python -m pytest tests/test_development_release_authorization.py tests/test_development_content_authorization.py tests/test_development_owner_operator.py tests/test_development_image_workflow.py -q --junitxml="$RUNNER_TEMP/development-owner-rejections.xml"
          python - <<'PYCODE'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'development-owner-rejections.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
          assert sum(int(s.get('tests', 0)) for s in suites) > 0
          assert all(int(s.get(key, 0)) == 0 for s in suites for key in ('skipped', 'failures', 'errors'))
          PYCODE

      - name: Development owner PostgreSQL identity regression (must execute, no skips)
        env:
          MIHUR_DEV_AUTH_PG_ADMIN_URL: postgresql+psycopg://postgres@localhost:5432/postgres
        run: |
          python -m pytest tests/test_development_authorization_postgresql.py -q --junitxml="$RUNNER_TEMP/development-owner-pg.xml"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'development-owner-pg.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
          assert sum(int(s.get('tests', 0)) for s in suites) == 5
          assert all(int(s.get(key, 0)) == 0 for s in suites for key in ('skipped', 'failures', 'errors'))
          PY

      - name: Gate 4 committed revision regression (must execute, no skips)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/ai_tutor
          MIHUR_GATE4_ISOLATED_DB: '1'
        run: pytest -q -rs tests/test_taxonomy_gate4_committed_revision.py -o fail_on_skipped=true

  containers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node for MVE regression check
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify versioned Help Center content parity
        run: node frontend/scripts/sync-help-guides.mjs --check

      - name: MVE contract regression check
        working-directory: frontend
        run: npm run check:mve

      - name: MVE mathematical truth regression tests
        working-directory: frontend
        run: npm run test:mve

      - name: Build deployable images
        run: docker compose build tutor-api llm-gateway frontend

      - name: Start Compose stack
        # QA: deterministic stub OCR so the photo-intake happy path is covered
        # in CI E2E (StubProvider exists for exactly this; Mathpix stays unset).
        env:
          PHOTO_OCR_PROVIDER: stub
        run: docker compose up -d --wait

      - name: Verify Tutor API health
        run: curl --fail --retry 5 --retry-delay 2 http://localhost:8002/health

      - name: Verify Gateway health from Tutor network
        run: docker compose exec -T tutor-api python -c "import urllib.request; urllib.request.urlopen('http://llm-gateway:8001/health')"

      - name: Verify frontend health
        run: curl --fail --retry 5 --retry-delay 2 http://localhost:3000/healthz

      - name: Migrate browser E2E database
        run: docker compose exec -T tutor-api alembic upgrade head

      - name: Seed browser E2E content
        run: |
          docker compose exec -T tutor-api python scripts/seed_sprint1.py
          docker compose exec -T tutor-api python scripts/seed_grade7.py
          docker compose exec -T tutor-api python scripts/seed_learn_content.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser E2E dependencies
        working-directory: e2e
        run: npm install

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Guided MVE keyboard and assessment browser checks
        run: node e2e/mve-guided-browser.mjs

      - name: Draft MTH1W equation Workspace isolation journey
        run: node e2e/equation-learning-flow-browser.mjs

      - name: Run synthetic browser E2E
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          # Matches PHOTO_OCR_PROVIDER=stub above; selects the stub happy-path
          # photo test and skips the disabled-provider degradation test.
          E2E_PHOTO_OCR: stub
        run: npm run test:e2e

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
