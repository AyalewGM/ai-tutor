map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location = /backend-health {
        proxy_pass http://tutor-api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    # Same-origin API proxy. Authentication cookies/headers remain browser-to-app
    # concerns; the frontend never receives provider or database credentials.
    location /api/ {
        client_max_body_size 6m;
        proxy_pass http://tutor-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The React SPA is the single user-facing surface. All UI paths (/, /login,
    # /learn, /learn/:sessionId, /parent, /parent/settings, …) resolve to the
    # SPA index.html and are routed client-side. Tutor API only serves /api/*.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
