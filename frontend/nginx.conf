server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location = /backend-health {
        proxy_pass http://tutor-api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Same-origin API proxy. Authentication cookies/headers remain browser-to-app
    # concerns; the frontend never receives provider or database credentials.
    location /api/ {
        proxy_pass http://tutor-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Learner workspace HTML is rendered by Tutor API so it consumes the same
    # server-authoritative pedagogy and authenticated same-origin session.
    location /learn/ {
        proxy_pass http://tutor-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve the static parent dashboard directly instead of allowing nginx's
    # implicit directory redirect to emit an absolute Location header using
    # the container's internal :8080 port. This keeps browser E2E and deployed
    # reverse-proxy navigation on the public same-origin URL.
    location = /parent {
        try_files /parent/index.html =404;
    }

    # React SPA lives under /app/ (built assets at /app/assets, fallback to its
    # own index.html). Server-rendered pages (/learn, /parent, /login) remain
    # the same-origin fallback surfaces.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
